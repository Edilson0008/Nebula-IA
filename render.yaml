# Deploy grátis do backend da Nébula no Render (https://render.com).
#
# Como usar:
#   1. Crie uma conta no Render e conecte o repositório do GitHub.
#   2. New → Blueprint → escolha este repositório.
#   3. O Render lê este arquivo e sobe sozinho.
#
# As conversas ficam no Supabase (permanentes), então o disco do Render pode
# ser apagado à vontade. Configure SUPABASE_URL e SUPABASE_KEY no painel do
# Render (Environment) — os valores saem do painel do Supabase (Settings → API).
#
# Nenhuma chave do Gemini vai aqui: cada usuário cola a própria no app.

services:
  - type: web
    name: nebula-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: WORKSPACE_DIR
        value: /tmp/nebula/workspace
      - key: AGENT_SCRATCH_DIR
        value: /tmp/nebula/scratch
      - key: CORS_ORIGIN_REGEX
        value: .*
      - key: PYTHONUNBUFFERED
        value: "1"
      # Preencha no painel do Render (são segredos):
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
