name: CI — verifica e compila a Nébula

# Roda a cada push e em pull requests.
# O que ele faz:
#   1. Backend: confere a sintaxe de todos os .py (nada de erro bobo subir).
#   2. Frontend: instala e roda o build (tsc --noEmit + vite build).
# Nenhuma chave é necessária: o projeto foi feito para o usuário colar a
# própria chave do Gemini no app (a chave nunca entra no repositório).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confere a sintaxe de todos os arquivos Python
        working-directory: backend
        run: |
          python -m compileall -q . && echo "OK: backend compila"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        working-directory: frontend
        run: npm ci

      - name: Compila (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

      - name: Guarda o site compilado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nebula-web
          path: frontend/dist
          if-no-files-found: error
